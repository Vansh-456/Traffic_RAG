[project]
name = "delhi-traffic-copilot"
version = "0.1.0"
description = "Advanced RAG assistant for Delhi traffic advisories, incidents and live conditions"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "pgvector>=0.3",
  "redis>=5.0",
  "litellm>=1.50",
  "httpx>=0.27",
  "tenacity>=9.0",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.20",
  "sse-starlette>=2.1",
  "langfuse>=2.50,<3",
  "pywebpush>=2.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
local-ml = [
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "fakeredis>=2.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-redis",
  "types-python-dateutil",
]

[project.scripts]
copilot = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "SIM102", "RUF007"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres + Redis (docker compose up db redis)",
  "network: hits real external websites",
]
addopts = "-m 'not network'"
